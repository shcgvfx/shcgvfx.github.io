<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11120f" />
    <meta name="description" content="Chronological progress log for SHVFX project 01." />
    <title>ailen — SHVFX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme:dark; --bg:#11120f; --panel:#181a16; --ink:#f1f0e9; --muted:#989a90; --line:#30332c; --lime:#d5f36a; --mono:"DM Mono",monospace; --sans:Manrope,Arial,sans-serif; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
      .shell { width:min(1080px,calc(100% - 88px)); margin:auto; }
      .topbar { height:86px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
      .brand { display:flex; align-items:center; gap:12px; font-size:15px; font-weight:800; letter-spacing:.06em; text-decoration:none; color:var(--ink); }
      .brand-mark { width:27px; height:27px; display:grid; place-items:center; border:1px solid var(--lime); border-radius:50%; color:var(--lime); font:12px var(--mono); }
      .back-link, .eyebrow, .meta, .step-heading { font:11px var(--mono); text-transform:uppercase; letter-spacing:.12em; }
      .back-link { color:var(--muted); text-decoration:none; }
      .back-link:hover { color:var(--lime); }
      .intro { padding:94px 0 78px; border-bottom:1px solid var(--line); }
      .eyebrow { color:var(--lime); margin:0 0 22px; }
      h1 { margin:0; font-size:clamp(48px,8vw,100px); letter-spacing:-.085em; line-height:.9; font-weight:600; }
      .intro-copy { color:var(--muted); margin:24px 0 0; font-size:15px; line-height:1.7; }
      .timeline { padding:54px 0 100px; }
      .timeline-head { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:25px; }
      .timeline-head h2 { margin:0; font-size:13px; font-weight:500; letter-spacing:.13em; text-transform:uppercase; }
      .meta { color:var(--muted); }
      .empty-state { min-height:230px; display:grid; place-items:center; border:1px dashed #3b3f32; color:var(--muted); background:linear-gradient(135deg,#171914,#11120f); text-align:center; padding:30px; font:11px var(--mono); letter-spacing:.12em; }
      .timeline-list { list-style:none; margin:0; padding:0; display:grid; gap:35px; }
      .timeline-item { border:1px solid var(--line); background:var(--panel); }
      .step-heading { padding:20px 23px; color:var(--lime); border-bottom:1px solid var(--line); }
      .step-image { display:block; width:100%; height:auto; background:#191b16; }
      footer { min-height:70px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
      @media (max-width:700px) { .shell { width:calc(100% - 40px); } .topbar { height:70px; } .intro { padding:70px 0 58px; } .timeline { padding:40px 0 72px; } .step-heading { padding:17px; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="index.html"><span class="brand-mark">S</span><span>SHVFX</span></a>
        <a class="back-link" href="index.html">← All projects</a>
      </header>
      <main>
        <section class="intro" aria-labelledby="project-title">
          <p class="eyebrow">Project / 01</p>
          <h1 id="project-title">ailen</h1>
          <p class="intro-copy">Character rigging progress in Maya.</p>
        </section>
        <section class="timeline" aria-labelledby="timeline-title">
          <div class="timeline-head"><h2 id="timeline-title">Progress timeline</h2><span class="meta">2 steps</span></div>
          <!-- Add each attached image as a timeline item, oldest first. Caption format: STEP 01: Title - YYYY-MM-DD. Store images in assets/project-01/. -->
          <ol class="timeline-list">
            <li class="timeline-item">
              <h3 class="step-heading">STEP 01: Leg IK - 2026-11-20</h3>
              <img class="step-image" src="assets/project-01/step01-leg-ik-2026-11-20.png" alt="Maya viewport showing the ailen leg rig with IK controls" />
            </li>
            <li class="timeline-item">
              <h3 class="step-heading">STEP 02: Spline Spine IK, Arm IK, FK - 2026-11-20</h3>
              <img class="step-image" src="assets/project-01/step02-spline-spine-ik-arm-ik-fk-2026-11-20.png" alt="Maya viewport showing the ailen character rig with spline, arm IK, and FK controls" />
            </li>
          </ol>
        </section>
      </main>
      <footer><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SHVFX</span></a><span class="meta">MAYA · RIGGING</span></footer>
    </div>
  </body>
</html>
